<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Default pitch black backdrop */
            overflow-x: hidden;
        }

        /* Fixed container that locks the canvas animation to the viewport */
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops and stretches the frames like a background image */
        }

        /* Invisible scroll spacer layer that forces the page to be scrollable */
        .scroll-spacer {
            position: relative;
            z-index: 2;
            height: 400vh; /* Adjust this height to manually give users more room to scroll */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="scroll-canvas"></canvas>
    </div>

    <div class="scroll-spacer"></div>

    <script>
        // ==========================================
        // 🎛️ CONFIGURATION SETTINGS
        // ==========================================
        const playbackSpeed = 0.5;     // ADJUST SPEED HERE: Lower = longer scroll needed, Higher = faster playback
        const totalFrames = 480;       // Set this to match the total count generated by your Python script
        
        // Tells the script where to locate your compiled .webp frames
        const currentFrame = index => `./frames/${index}.webp`; 

        // ==========================================
        // 🚀 CORE CANVAS SCROLL LOGIC
        // ==========================================
        const canvas = document.getElementById("scroll-canvas");
        const context = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const images = [];

        // Preload WebP images to memory to prevent viewport flashing
        for (let i = 0; i < totalFrames; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        images[0].onload = () => {
            renderFrame(0);
        };

        function renderFrame(index) {
            if (!images[index]) return;
            
            const img = images[index];
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.width / img.height;
            
            let drawWidth, drawHeight, drawX, drawY;

            // Maintain aspect ratio cover calculation
            if (canvasRatio > imgRatio) {
                drawWidth = canvas.width;
                drawHeight = canvas.width / imgRatio;
                drawX = 0;
                drawY = (canvas.height - drawHeight) / 2;
            } else {
                drawWidth = canvas.height * imgRatio;
                drawHeight = canvas.height;
                drawX = (canvas.width - drawWidth) / 2;
                drawY = 0;
            }

            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(img, drawX, drawY, drawWidth, drawHeight);
        }

        // Map scroll position smoothly to frame indices
        window.addEventListener("scroll", () => {
            const scrollTop = window.scrollY;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            let frameIndex = Math.floor(scrollFraction * totalFrames * playbackSpeed);
            frameIndex = Math.max(0, Math.min(totalFrames - 1, frameIndex));
            
            requestAnimationFrame(() => renderFrame(frameIndex));
        });

        // Maintain full responsiveness on window resize recalculations
        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const scrollTop = window.scrollY;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            let frameIndex = Math.floor(scrollFraction * totalFrames * playbackSpeed);
            frameIndex = Math.max(0, Math.min(totalFrames - 1, frameIndex));
            
            renderFrame(frameIndex);
        });
    </script>
</body>
</html>
